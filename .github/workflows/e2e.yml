name: e2e

# Real-binary tests: builds each brand (release profile + the `e2e` feature) and drives it
# through tauri-driver (WebDriver) on Windows and Linux: App Lock, the wrong-password throttle
# across restarts, idle lock, older-copy refusal, password-protected backup round trip, erase,
# Linux without a keyring, and no plaintext database anywhere in the data folder (scratch and
# default layouts). See apps/desktop/e2e/run.mjs.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Linux system libraries, WebKit WebDriver, Xvfb and a keyring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential pkg-config webkit2gtk-driver xvfb gnome-keyring dbus-x11

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: e2e

      - name: tauri-driver
        run: |
          if ! command -v tauri-driver >/dev/null; then
            cargo install tauri-driver --version 2.1.0 --locked
          fi
          tauri-driver --help | head -3 || true

      - name: msedgedriver matching the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/install-msedgedriver.ps1

      - name: Build both brands (release + e2e feature, no installers)
        run: |
          set -euo pipefail
          for brand in dojix greenwick; do
            (cd apps/desktop && pnpm tauri build --no-bundle --ci \
              --features brand-$brand,e2e \
              --config src-tauri/tauri.$brand.conf.json \
              --config src-tauri/tauri.e2e.conf.json)
            tools/ci/copy-binary.sh $brand
          done

      - name: Self-test of the e2e binaries (diagnostics before the WebDriver run)
        run: |
          WRAP=""
          if [ "$RUNNER_OS" = "Linux" ]; then WRAP="tools/ci/with-keyring.sh"; fi
          for brand in dojix greenwick; do
            dir="$RUNNER_TEMP/selftest-$brand"
            set +e
            $WRAP e2e-bin/$brand/$brand --self-test --data-dir "$dir" --vault-service "e2e.selftest.$brand"
            code=$?
            set -e
            echo "$brand self-test exit code: $code"
            cat "$dir"/logs/*.log 2>/dev/null || echo "(no log)"
            [ "$code" = "0" ] || exit 1
          done

      - name: Lock, throttle, idle lock, older copy, backup round trip, erase, default data folder
        run: |
          set -euo pipefail
          status=0
          for brand in dojix greenwick; do
            echo "::group::$brand"
            if [ "$RUNNER_OS" = "Windows" ]; then
              node apps/desktop/e2e/run.mjs --brand $brand --app e2e-bin/$brand/$brand.exe \
                --native-driver "$MSEDGEDRIVER" --out e2e-output --scenario all || status=1
            else
              xvfb-run -a tools/ci/with-keyring.sh \
                node apps/desktop/e2e/run.mjs --brand $brand --app e2e-bin/$brand/$brand \
                --out e2e-output --scenario all || status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Linux without a Secret Service (App Lock required, key in the data folder)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          status=0
          for brand in dojix greenwick; do
            echo "::group::$brand"
            xvfb-run -a tools/ci/with-session-bus.sh \
              node apps/desktop/e2e/run.mjs --brand $brand --app e2e-bin/$brand/$brand \
              --out e2e-output --scenario no-keyring || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: msedgedriver log (Windows, on failure)
        if: failure() && runner.os == 'Windows'
        run: |
          grep -o 'WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = .*' "$MSEDGEDRIVER_LOG" | head -1 | fold -w 200 || true
          grep -E '^\[' "$MSEDGEDRIVER_LOG" | cut -c1-300 | head -40 || true
          ls "$LOCALAPPDATA"/io.github.djctwo.*/logs/ 2>/dev/null && cat "$LOCALAPPDATA"/io.github.djctwo.*/logs/*.log || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-output/
          if-no-files-found: ignore
