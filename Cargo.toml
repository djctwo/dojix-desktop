[workspace]
members = ["apps/desktop/src-tauri"]
resolver = "2"

[profile.release]
# Smaller binaries, and no symbol names for the release string scan to trip over.
strip = "symbols"

# Key derivation and hashing are slow without optimisation; tests derive many keys.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
