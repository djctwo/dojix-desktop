[package]
name = "dojix-desktop"
version = "0.1.0"
description = "Dojix and Greenwick trading journals for Windows and Linux"
authors = ["Douglas Cleary"]
license = "GPL-3.0-or-later"
repository = "https://github.com/djctwo/dojix-desktop"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "dojix_desktop_lib"
crate-type = ["rlib"]

[features]
# Exactly one brand must be enabled: --features brand-dojix or --features brand-greenwick.
brand-dojix = []
brand-greenwick = []
# Test-only IPC hooks (and devtools, which WebDriver needs). Never enabled in release or
# installer builds.
e2e = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-single-instance = "=2.5.4"
# Plain SQLite held in memory only; `serialize` gives the image that is sealed to disk.
rusqlite = { version = "=0.40.2", features = ["bundled", "serialize"] }
rusqlite_migration = "=2.6.0"
# AES-256-GCM for the sealed journal file.
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
# OS credential vault: Windows Credential Manager, Secret Service on Linux.
keyring = "=4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
getrandom = "0.3"
zeroize = "1"
thiserror = "2"
dirs = "6"
# App Lock key wrapping and desktop backups (SPEC 6.4, 6.8): Argon2id.
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
# Reading Mac backups (PBKDF2-SHA256) and the rollback record's file hash.
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
sha2 = "0.10"
subtle = "2"
# File dialogs for backup export and restore, opened from Rust only (no web-view permission).
tauri-plugin-dialog = "2"
# Online features (SPEC 8): HTTPS with rustls and the OS trust store (rustls-platform-verifier,
# no pinning), WebSocket price streams, the async runtime Tauri already uses.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# logind / screensaver signals for the auto-lock triggers (already used by the window layer).
dbus = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
# Contract tests for every online endpoint against local mock servers (no real network).
wiremock = "=0.6.5"
