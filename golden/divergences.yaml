# Intentional differences from the Mac apps (PARITY.md §B1), read by tools/parity-check.
#
# Each entry: id, app (dojix | greenwick | both), headline (can it change a Dashboard header
# number?), approved (headline entries need the maintainer's approval: given 2026-10-27,
# DECISIONS.md #8), reason, test (the red→green test that proves the fix; filled in Phase 2),
# affects (reference keys whose values may legitimately differ: "outputs.<Component>",
# "import.parsed", "import.journal", or "*" for every value of the listed fixtures), and
# fixtures (fixture ids the entry applies to; [] = all).
#
# parity-check fails when a reference value differs without an entry, when an approved entry has
# no test (--strict, from Phase 2), or when a headline fix is implemented (has a test) without
# approval. An entry with approved: false and test: null is a proposal: it records a Mac behaviour
# someone wants to fix and covers no difference until the maintainer approves it.

